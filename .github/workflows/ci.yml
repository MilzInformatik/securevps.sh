name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck securevps.sh tests/integration/*.sh
      - name: the script parses and answers for itself
        run: |
          bash -n securevps.sh
          ./securevps.sh --version
          ./securevps.sh help > /dev/null
      # "--only nosuchmodule harden" used to pass here for the wrong reason:
      # it was rejected as an unexpected argument, never reaching the module
      # check. scan needs no root, so it exercises the real path.
      - name: bad input is refused
        run: |
          ! ./securevps.sh --no-such-flag 2>/dev/null
          ! ./securevps.sh nosuchcommand 2>/dev/null
          ! ./securevps.sh harden scan 2>/dev/null
          ./securevps.sh scan --only nosuchmodule 2>&1 | grep -q 'unknown module'
      - name: the command is accepted before or after the flags
        run: |
          ./securevps.sh --profile minimal scan --json > /dev/null || true
          ./securevps.sh scan --profile minimal --json > /dev/null || true

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [noble, jammy, bookworm]
    steps:
      - uses: actions/checkout@v4
      - name: install debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap
      - name: run the suite in a throwaway rootfs
        run: sudo tests/integration/run.sh ${{ matrix.suite }}
